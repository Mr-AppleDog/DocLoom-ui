apiVersion: apps/v1
kind: Deployment
metadata:
  name: docloom-ui
  labels:
    app: docloom-ui
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: docloom-ui
  template:
    metadata:
      labels:
        app: docloom-ui
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docloom-ui
          image: docloom-ui:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # 不设容器级 securityContext: nginx:alpine 启动需 CAP_CHOWN chown 缓存目录,
          # drop ALL 会导致 chown 失败崩溃;故此处不放 securityContext。
