apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docloom-ui-staging
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: docloom-ui=localhost:5000/docloom-ui
    argocd-image-updater.argoproj.io/write-back-method: argocd
    argocd-image-updater.argoproj.io/update-strategy: latest
    argocd-image-updater.argoproj.io/force-update: "true"
spec:
  project: default
  source:
    repoURL: https://github.com/Mr-AppleDog/DocLoom-ui.git
    targetRevision: master
    path: deploy/gitops/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: docloom
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
