apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docloom-ui-staging
  namespace: argocd
spec:
  project: default
  source:
    # 单仓库 GitOps:Argo 只读 deploy/staging 分支(部署状态分支)的 staging overlay。
    repoURL: https://github.com/Mr-AppleDog/DocLoom-ui.git
    targetRevision: deploy/staging
    path: deploy/gitops/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: docloom
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
